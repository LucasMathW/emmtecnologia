services:
  redis-emmtecnologia:
    image: redis:7-alpine
    container_name: redis-emmtecnologia
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_emmtecnologia_data:/data

  postgres-emmtecnologia:
    image: postgres:16-alpine
    container_name: postgres-emmtecnologia
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app_data_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_emmtecnologia_data:/var/lib/postgresql/data

volumes:
  redis_emmtecnologia_data:
  postgres_emmtecnologia_data:
